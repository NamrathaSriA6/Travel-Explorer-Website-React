<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Explorer</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
      }

      .navbar {
        background-color: #333;
        padding: 1rem;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .navbar ul {
        list-style: none;
        display: flex;
        gap: 1rem;
      }

      .navbar li {
        cursor: pointer;
      }

      .hero {
        text-align: center;
        padding: 3rem;
        background: linear-gradient(to right, #2193b0, #6dd5ed);
        color: white;
      }

      .destinations {
        padding: 2rem;
        text-align: center;
      }

      .destination-cards {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        flex-wrap: wrap;
      }

      .card {
        background: white;
        border-radius: 10px;
        overflow: hidden;
        width: 200px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      .card img {
        width: 100%;
        height: 140px;
        object-fit: cover;
      }

      .card h3 {
        margin: 0.5rem 0;
      }

      .footer {
        text-align: center;
        padding: 1rem;
        background-color: #333;
        color: white;
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
